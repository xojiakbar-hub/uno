<!doctype html>
<html lang="uz"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#071e22"><title>UNO Friends</title><link rel="stylesheet" href="style.css"><script src="https://telegram.org/js/telegram-web-app.js"></script></head>
<body><main class="app">
<header><div><span class="logo">UNO</span><small> FRIENDS ONLINE</small></div><button id="restart" class="ghost">↻ Chiqish</button></header>
<section id="lobby" class="panel">
<h1>Do‘stlaring bilan UNO o‘yna!</h1><p>Yangi xona och yoki do‘sting yuborgan kod orqali ulan.</p>
<label>Ismingiz</label><input id="name" maxlength="18" placeholder="Ismingizni yozing">
<button id="create" class="primary">+ Xona yaratish</button>
<div class="or">YOKI KOD ORQALI KIRISH</div><input id="roomCode" maxlength="5" placeholder="5 xonali kod" class="code"><button id="join" class="secondary">Xonaga qo‘shilish</button>
<div id="lobbyMsg" class="msg"></div></section>
<section id="roomPanel" class="panel hidden"><div class="roomTitle">XONA KODI</div><div class="codeLine"><strong id="codeText">-----</strong><button id="copy" class="ghost">Nusxa olish</button></div><p>Do‘stlaringizga kodni yuboring.</p><div id="playerList" class="playerList"></div><button id="start" class="primary hidden">O‘yinni boshlash</button><div id="waiting" class="msg">Kamida 2 kishi kerak.</div></section>
<section id="game" class="hidden">
<div class="players" id="players"></div><div class="table"><div class="turn" id="turn">Navbat...</div><div class="center"><button id="draw" class="deck">UNO<br><small>KARTA OLISH</small></button><div class="discard" id="discard"></div></div><div id="status" class="msg">O‘yin boshlandi</div><div id="colors" class="colors hidden"><span>Rang tanla:</span><button data-color="red" class="red"></button><button data-color="yellow" class="yellow"></button><button data-color="green" class="green"></button><button data-color="blue" class="blue"></button></div></div>
<div class="myTitle"><b>SIZNING KARTALARINGIZ</b><span id="count"></span></div><div id="hand" class="hand"></div></section>
<div id="toast" class="toast"></div>
</main><script src="/socket.io/socket.io.js">
  <script>
const tg = window.Telegram.WebApp;

tg.ready();
tg.expand();

const user = tg.initDataUnsafe?.user;
const nameInput = document.getElementById("name");

if (user && nameInput) {
    nameInput.value = user.first_name || "Player";
}
</script>
</script><script src="game.js"></script></body></html>
